<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Flex Layout</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <h1 class="text-white text-center bg-black p-4">Tailwind Flex Layout</h1>

  <!-- Flex Container -->
  <div class="flex justify-center items-center gap-6 h-screen">

    <!-- Box 1 -->
    <div class="bg-blue-500 text-white p-10 rounded-xl shadow-lg">
      Box 1
    </div>

    <!-- Box 2 -->
    <div class="bg-green-500 text-white p-10 rounded-xl shadow-lg">
      Box 2
    </div>

    <!-- Box 3 -->
    <div class="bg-red-500 text-white p-10 rounded-xl shadow-lg">
      Box 3
    </div>

  </div>

</body>
</html>
